name: Docker image for multi-arch

on:
  workflow_dispatch:
  schedule:
    #every month the 23rd at 6:23am
    - cron: '23 6 23 * *'

env:
  PG_IMAGE: postgres-debugger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - bookworm
          - trixie
        platform:
          - linux/amd64,linux/arm64
        version:
          - 13
          - 14
          - 15
          - 16
          - 17
          - 18

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: print-vars

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push bookworm
        if: matrix.image == 'bookworm'
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: ${{ matrix.platform }}
          build-args: |
            TAG=${{ matrix.version }}
            BASE_IMAGE=${{ matrix.version }}-${{ matrix.image }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PG_IMAGE }}:${{ matrix.version }}-${{ matrix.image }}

      - name: Build and push trixie
        if: matrix.image == 'trixie'
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: ${{ matrix.platform }}
          build-args: |
            TAG=${{ matrix.version }}
            BASE_IMAGE=${{ matrix.version }}-${{ matrix.image }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PG_IMAGE }}:${{ matrix.version }}-${{ matrix.image }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PG_IMAGE }}:${{ matrix.version }}

  # GitHub disables scheduled workflows after 60 days without repository
  # activity; this resets the counter on every monthly run.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/docker-publish.yaml/enable"
